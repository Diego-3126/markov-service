server:
  port: 8083
  servlet:
    context-path: /

spring:
  application:
    name: markov-service
  profiles:
    active: prod  # ← Cambiar a prod para EC2

  datasource:
    url: jdbc:mysql://your-rds-endpoint:3306/markovdb  # ← Usar MySQL en RDS
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false  # ← Desactivar en producción

# ✅ CONFIGURACIÓN LINUX - CAMBIOS IMPORTANTES
markov:
  native:
    library-path: /home/ec2-user/markov-service/src/main/resources/native/libmarkovova.so  # ← Ruta absoluta en EC2
    library-name: markovova  # ← Nombre sin "lib" y sin ".so"
    fallback-enabled: false  # ← Forzar uso de librería real
    debug-mode: false  # ← Desactivar debug en producción

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.ova.platform.markov: INFO  # ← Solo INFO en producción
    org.springframework.web: WARN