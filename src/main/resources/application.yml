# src/main/resources/application.yml
server:
  port: 8083
  servlet:
    context-path: /

spring:
  application:
    name: markov-service
  profiles:
    active: dev

  # ✅ CONFIGURACIÓN BASE DE DATOS H2 (NUEVO)
  datasource:
    url: jdbc:h2:mem:markovdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # ✅ CONFIGURACIÓN JPA (NUEVO)
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # Crea las tablas automáticamente
    show-sql: true           # Muestra SQL en logs (útil para desarrollo)
    properties:
      hibernate:
        format_sql: true     # Formatea el SQL para mejor legibilidad

  # ✅ CONSOLA H2 (NUEVO - para ver la BD en navegador)
  h2:
    console:
      enabled: true
      path: /h2-console

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Configuración Markov
markov:
  native:
    library-path: src/main/resources/native/libmarkovova.so
    library-name: markov
    fallback-enabled: true
    debug-mode: true

# Logging
logging:
  level:
    com.ova.platform.markov: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG        # ✅ NUEVO - ver queries SQL
    org.hibernate.type: TRACE       # ✅ NUEVO - ver parámetros SQL
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{50} - %msg%n"